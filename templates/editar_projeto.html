<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Projeto — Painel Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .admin-section {
            background: var(--card-bg);
            border: 1px solid var(--gray-border);
            padding: 2.5rem;
            margin-bottom: 3rem;
            border-radius: 16px;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--gray-border);
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            border-radius: 10px;
        }
        .btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--gray-border);
            background: var(--bg-color);
            color: inherit;
            font-size: 1rem;
            border-radius: 10px;
            outline: none;
            transition: var(--transition);
        }
        input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="light-theme">

    <header>
        <a href="/admin" class="logo">← Voltar para o Painel</a>
        <div class="nav-right">
            <button class="theme-toggle" onclick="alternarTema()" aria-label="Alternar Tema">
                <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.51 4.92l2.12 2.12 1.41-1.41L4.92 3.51 3.51 4.92zm14.85 14.85l2.12 2.12 1.41-1.41-2.12-2.12-1.41 1.41zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM4.92 19.08l1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12zm14.85-14.85l1.41 1.41 2.12-2.12-1.41-1.41-2.12 2.12z"/></svg>
                <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main style="max-width: 850px; margin: 0 auto; padding-bottom: 5rem;">
        
        <div style="margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.2rem; letter-spacing: -1px; margin-bottom: 0.5rem;">Editar Projeto</h1>
            <p style="color: var(--text-muted);">Alterando as informações de: <strong>{{ projeto.titulo }}</strong></p>
        </div>

        <section class="admin-section">
            <form action="/admin/projeto/editar/{{ projeto.id }}" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.2rem;">
                
                <div style="display: grid; grid-template-columns: 2fr 2fr; gap: 1rem;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Título *</label>
                        <input type="text" name="titulo" value="{{ projeto.titulo }}" required>
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Slug *</label>
                        <input type="text" name="slug" value="{{ projeto.slug }}" required>
                    </div>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Descrição Curta * (Máximo 110 caracteres)</label>
                    <textarea name="descricao_curta" rows="2" maxlength="110" required style="resize: none;">{{ projeto.descricao_curta }}</textarea>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Descrição Longa * <span style="font-size:0.8rem; font-weight:400; color:var(--text-muted);">(Dica: use &lt;color:#3B82F6&gt;texto&lt;/color&gt; para colorir partes do texto)</span></label>
                    <textarea name="descricao_longa" rows="6" required style="resize: vertical;">{{ projeto.descricao_longa }}</textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Alterar Imagem de Capa (Opcional)</label>
                        <input type="file" name="imagem_capa" accept="image/png, image/jpeg, image/webp" style="font-size: 0.9rem;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Adicionar Fotos Extras (Galeria)</label>
                        <input type="file" name="imagens_extras" accept="image/png, image/jpeg, image/webp" multiple style="font-size: 0.9rem;">
                    </div>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">URL do Vídeo YouTube (Opcional)</label>
                    <input type="text" name="video_url" value="{{ projeto.video_url if projeto.video_url else '' }}">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">GitHub (Opcional)</label>
                        <input type="text" name="link_github" value="{{ projeto.link_github if projeto.link_github else '' }}">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Deploy (Opcional)</label>
                        <input type="text" name="link_deploy" value="{{ projeto.link_deploy if projeto.link_deploy else '' }}">
                    </div>
                </div>

                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem;">Download (Opcional)</label>
                    <input type="text" name="tipo_download" value="{{ projeto.tipo_download if projeto.tipo_download else '' }}">
                </div>

                <div style="display: flex; align-items: center; gap: 0.8rem; margin-top: 0.5rem;">
                    <input type="checkbox" id="destaque" name="destaque" value="1" {% if projeto.destaque == 1 %}checked{% endif %} style="width: 18px; height: 18px; cursor: pointer;">
                    <label for="destaque" style="font-weight: 600; font-size: 0.95rem; cursor: pointer;">Exibir nos 3 Destaques da Home</label>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn" style="flex: 2; justify-content: center;">Salvar Alterações</button>
                    <a href="/admin" class="btn-secondary" style="flex: 1; text-align: center; display: flex; align-items: center; justify-content: center;">Cancelar</a>
                </div>

            </form>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const descTextarea = document.querySelector('textarea[name="descricao_curta"]');
            if (descTextarea) {
                const counter = document.createElement('div');
                counter.style.cssText = 'font-size: 0.8rem; color: var(--text-muted); text-align: right; margin-top: 0.3rem;';
                descTextarea.parentNode.appendChild(counter);
                
                function updateCounter() {
                    counter.textContent = `${descTextarea.value.length}/110 caracteres`;
                }
                descTextarea.addEventListener('input', updateCounter);
                updateCounter();
            }

            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', function(e) {
                    const btn = form.querySelector('button[type="submit"]');
                    if (btn) {
                        btn.disabled = true;
                        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Salvando...`;
                    }
                });
            });
        });

        function alternarTema() {
            document.body.classList.toggle('light-theme');
            if (document.body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        } else {
            document.body.classList.remove('light-theme');
        }
    </script>
</body>
</html>
