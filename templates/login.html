<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Painel Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            padding-bottom: 1.8rem;
            margin-bottom: 3rem;
        }
    </style>
</head>
<body>

    <header class="login-header">
        <a href="/" class="logo">Nathan Moreira Ramos</a>
        <div class="nav-right">
            <button class="theme-toggle" onclick="alternarTema()" aria-label="Alternar Tema">
                <!-- Ícone de Sol -->
                <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.51 4.92l2.12 2.12 1.41-1.41L4.92 3.51 3.51 4.92zm14.85 14.85l2.12 2.12 1.41-1.41-2.12-2.12-1.41 1.41zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM4.92 19.08l1.41-1.41 2.12 2.12-1.41 1.41-2.12-2.12zm14.85-14.85l1.41 1.41 2.12-2.12-1.41-1.41-2.12 2.12z"/></svg>
                <!-- Ícone de Lua -->
                <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </div>
    </header>

    <main style="max-width: 420px; margin: 2rem auto;">
        <div class="about-content" style="margin-bottom: 0;">
            <div class="eyebrow"><span class="dot"></span> ÁREA RESTRITA</div>
            <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: 0.2px; margin-bottom: 1.8rem;">Acesso administrativo</h1>

            {% if erro %}
            <div class="alert-error" style="background:rgba(229,72,77,0.1);border:1px solid var(--danger-color);color:var(--danger-color);padding:1rem;margin-bottom:1.5rem;font-weight:600;font-size:0.88rem;border-radius:var(--radius-sm);">
                {{ erro }}
            </div>
            {% endif %}

            <form method="POST" style="display:flex;flex-direction:column;gap:1.2rem;">
                <div>
                    <label style="display:block;font-family: var(--font-mono);font-weight:500;margin-bottom:0.5rem;font-size:0.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;">Usuário</label>
                    <input type="text" name="usuario" required autofocus
                        style="width:100%;padding:0.8rem 1rem;border:1px solid var(--gray-border);background:var(--bg-color);color:inherit;font-size:1rem;font-family:var(--font-mono);border-radius:var(--radius-sm);">
                </div>
                <div>
                    <label style="display:block;font-family: var(--font-mono);font-weight:500;margin-bottom:0.5rem;font-size:0.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;">Senha</label>
                    <input type="password" name="senha" required
                        style="width:100%;padding:0.8rem 1rem;border:1px solid var(--gray-border);background:var(--bg-color);color:inherit;font-size:1rem;font-family:var(--font-mono);border-radius:var(--radius-sm);">
                </div>
                <button type="submit" class="btn" style="cursor:pointer;width:100%;text-align:center;margin-top:0.5rem;justify-content:center;">entrar</button>
            </form>
        </div>
    </main>

    <script>
        function alternarTema() {
            document.body.classList.toggle('light-theme');
            if (document.body.classList.contains('light-theme')) {
                localStorage.setItem('theme', 'light');
            } else {
                localStorage.setItem('theme', 'dark');
            }
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
        } else {
            document.body.classList.remove('light-theme');
        }
    </script>
</body>
</html>
